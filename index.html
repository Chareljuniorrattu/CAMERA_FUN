<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fix Tracking Tangan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #webcam {
            width: 100%;
            height: 100%;
            object-fit: contain;
            /* PAKAI contain biar proporsi video terjaga */
            background: #000;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #0f0;
            padding: 10px 20px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 14px;
            z-index: 100;
            border: 1px solid #0f0;
        }
        .debug {
            position: fixed;
            top: 10px;
            left: 10px;
            color: #fff;
            font-family: monospace;
            font-size: 12px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div id="container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="overlay"></canvas>
    </div>
    <div class="debug" id="debug">⏳ Memulai...</div>
    <div class="info">🟢 Lingkaran hijau = ujung telunjuk (harus tepat di jari)</div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <script>
        (function() {
            const video = document.getElementById('webcam');
            const canvas = document.getElementById('overlay');
            const ctx = canvas.getContext('2d');
            const debug = document.getElementById('debug');

            // --- UKURAN VIDEO ASLI ---
            const VIDEO_W = 640;
            const VIDEO_H = 480;

            // --- SETUP CANVAS ---
            function setupCanvas() {
                // Canvas pakai resolusi video asli
                canvas.width = VIDEO_W;
                canvas.height = VIDEO_H;
                // Tampilan CSS full
                canvas.style.width = '100%';
                canvas.style.height = '100%';
                canvas.style.position = 'absolute';
                canvas.style.top = '0';
                canvas.style.left = '0';
                canvas.style.pointerEvents = 'none';
                // JANGAN mirror di CSS, kita mirror di JS
                canvas.style.transform = 'none';
            }
            setupCanvas();

            // --- VARIABEL ---
            let handData = [];
            let frameCount = 0;

            // --- FUNGSI GAMBAR ---
            function drawHands() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (!handData || handData.length === 0) {
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.font = '20px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('Tunjukkan tangan Anda', canvas.width/2, canvas.height/2);
                    debug.textContent = '⏳ Menunggu tangan...';
                    return;
                }

                debug.textContent = `✅ ${handData.length} tangan terdeteksi`;

                for (let h = 0; h < handData.length; h++) {
                    const hand = handData[h].landmarks;
                    const label = handData[h].label;

                    // Gambar semua titik (merah kecil)
                    for (let i = 0; i < hand.length; i++) {
                        const lm = hand[i];
                        // 🔥 MIRROR di sini: x = 1 - x
                        const x = (1 - lm.x) * canvas.width;
                        const y = lm.y * canvas.height;

                        ctx.beginPath();
                        ctx.arc(x, y, 3, 0, 2 * Math.PI);
                        ctx.fillStyle = '#FF0000';
                        ctx.fill();
                    }

                    // 🔥 GAMBAR UJUNG TELUNJUK (landmark 8) - HARUS TEPAT
                    const tip = hand[8];
                    if (tip) {
                        const x = (1 - tip.x) * canvas.width;
                        const y = tip.y * canvas.height;

                        // Lingkaran hijau BESAR
                        ctx.shadowColor = '#00FF00';
                        ctx.shadowBlur = 50;
                        ctx.beginPath();
                        ctx.arc(x, y, 30, 0, 2 * Math.PI);
                        ctx.fillStyle = 'rgba(0, 255, 0, 0.7)';
                        ctx.fill();
                        ctx.shadowBlur = 0;
                        ctx.strokeStyle = '#FFFFFF';
                        ctx.lineWidth = 3;
                        ctx.stroke();

                        // Tulisan
                        ctx.fillStyle = '#FFFFFF';
                        ctx.font = 'bold 16px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText('👉 TELUNJUK', x, y - 40);
                    }

                    // Label tangan
                    const wrist = hand[0];
                    if (wrist) {
                        const x = (1 - wrist.x) * canvas.width;
                        const y = wrist.y * canvas.height - 70;
                        ctx.fillStyle = '#00FFFF';
                        ctx.font = 'bold 18px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText(`${label} HAND`, x, y);
                    }
                }
            }

            // --- MEDIAPIPE ---
            const hands = new Hands({
                locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
                }
            });

            hands.setOptions({
                maxNumHands: 2,
                modelComplexity: 0,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults((results) => {
                handData = [];

                if (results.multiHandLandmarks && results.multiHandedness) {
                    for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                        handData.push({
                            landmarks: results.multiHandLandmarks[i],
                            label: results.multiHandedness[i].label
                        });
                    }
                }

                drawHands();
                frameCount++;
            });

            // --- KAMERA ---
            debug.textContent = '📷 Memulai kamera...';

            // 🔥 PASTIKAN VIDEO TIDAK DI-MIRROR DI SINI
            // Kita mirror di JS, bukan di CSS
            const camera = new Camera(video, {
                onFrame: async () => {
                    await hands.send({ image: video });
                },
                width: VIDEO_W,
                height: VIDEO_H,
                facingMode: "user"
            });

            camera.start().then(() => {
                debug.textContent = '📷 Kamera aktif - Tunjukkan tangan!';
                console.log('✅ Kamera berjalan');
            }).catch((err) => {
                debug.textContent = '❌ Error: ' + err.message;
                console.error(err);
            });

            // --- RESIZE ---
            window.addEventListener('resize', () => {
                // Tidak perlu resize canvas, hanya CSS
            });

            console.log('🔍 Mode fix tracking - Mirror di JS');
        })();
    </script>
</body>
</html>
