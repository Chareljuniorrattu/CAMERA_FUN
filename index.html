<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracking Tangan - Debug</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: black;
    }
    #video-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* Hapus mirror dulu untuk debugging */
      /* transform: scaleX(-1); */
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .info {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: white;
      font-family: sans-serif;
      background: rgba(0,0,0,0.7);
      padding: 15px 20px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 10;
      pointer-events: none;
      line-height: 1.6;
    }
    .debug-info {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #0f0;
      font-family: monospace;
      font-size: 14px;
      z-index: 10;
      pointer-events: none;
      background: rgba(0,0,0,0.7);
      padding: 10px 15px;
      border-radius: 4px;
    }
    .fps-counter {
      position: absolute;
      top: 20px;
      right: 20px;
      color: #0f0;
      font-family: monospace;
      font-size: 16px;
      z-index: 10;
      pointer-events: none;
      background: rgba(0,0,0,0.5);
      padding: 5px 10px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="video-container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="overlay"></canvas>
    <div class="debug-info" id="debugInfo">⏳ Menunggu kamera...</div>
    <div class="info">
      <b>🖐️ Mode Debug</b><br>
      • Titik hijau = ujung jari telunjuk<br>
      • Titik merah = semua landmark tangan<br>
      • Garis biru = koneksi antar landmark
    </div>
    <div class="fps-counter" id="fps">FPS: 0</div>
  </div>

  <!-- Library MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  
  <script>
    (function() {
      // --- ELEMEN ---
      const video = document.getElementById('webcam');
      const canvas = document.getElementById('overlay');
      const ctx = canvas.getContext('2d');
      const fpsDisplay = document.getElementById('fps');
      const debugInfo = document.getElementById('debugInfo');

      // --- UKURAN CANVAS ---
      let canvasWidth, canvasHeight;
      
      function resizeCanvas() {
        canvasWidth = window.innerWidth;
        canvasHeight = window.innerHeight;
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;
        canvas.style.width = '100%';
        canvas.style.height = '100%';
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      // --- VARIABEL ---
      let handLandmarks = [];
      let handLabels = [];
      let frameCount = 0;
      let lastFpsUpdate = performance.now();
      let detectionStatus = '⏳ Menunggu deteksi...';

      // --- FUNGSI GAMBAR LANDMARK ---
      function drawLandmarks() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (handLandmarks.length === 0) {
          // Gambar teks "Tidak ada tangan terdeteksi"
          ctx.fillStyle = 'rgba(255,255,255,0.5)';
          ctx.font = '24px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('✋ Tunjukkan tangan Anda', canvas.width/2, canvas.height/2);
          return;
        }

        // Loop setiap tangan yang terdeteksi
        for (let h = 0; h < handLandmarks.length; h++) {
          const landmarks = handLandmarks[h];
          const label = handLabels[h] || 'Unknown';

          // Gambar semua titik landmark (merah)
          for (let i = 0; i < landmarks.length; i++) {
            const lm = landmarks[i];
            const x = lm.x * canvas.width;
            const y = lm.y * canvas.height;

            // Titik kecil untuk semua landmark
            ctx.beginPath();
            ctx.arc(x, y, 4, 0, 2 * Math.PI);
            ctx.fillStyle = '#FF0000';
            ctx.fill();
            
            // Tambahkan nomor landmark
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.font = '10px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(i, x + 10, y - 5);
          }

          // Gambar koneksi antar landmark (garis biru transparan)
          const connections = [
            [0,1], [1,2], [2,3], [3,4], // Ibu jari
            [0,5], [5,6], [6,7], [7,8], // Telunjuk
            [0,9], [9,10], [10,11], [11,12], // Jari tengah
            [0,13], [13,14], [14,15], [15,16], // Jari manis
            [0,17], [17,18], [18,19], [19,20], // Kelingking
            [5,9], [9,13], [13,17] // Telapak tangan
          ];

          ctx.strokeStyle = 'rgba(0, 150, 255, 0.3)';
          ctx.lineWidth = 1;
          for (let conn of connections) {
            const lm1 = landmarks[conn[0]];
            const lm2 = landmarks[conn[1]];
            if (lm1 && lm2) {
              ctx.beginPath();
              ctx.moveTo(lm1.x * canvas.width, lm1.y * canvas.height);
              ctx.lineTo(lm2.x * canvas.width, lm2.y * canvas.height);
              ctx.stroke();
            }
          }

          // Gambar ujung jari telunjuk (landmark 8) dengan lingkaran BESAR HIJAU
          const indexTip = landmarks[8];
          if (indexTip) {
            const x = indexTip.x * canvas.width;
            const y = indexTip.y * canvas.height;
            
            // Lingkaran hijau besar dengan efek glow
            ctx.shadowColor = '#00FF00';
            ctx.shadowBlur = 30;
            ctx.beginPath();
            ctx.arc(x, y, 20, 0, 2 * Math.PI);
            ctx.fillStyle = 'rgba(0, 255, 0, 0.7)';
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            // Tulisan "Telunjuk"
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('👆 TELUNJUK', x, y - 30);
          }

          // Tampilkan label tangan
          const wrist = landmarks[0];
          if (wrist) {
            const x = wrist.x * canvas.width;
            const y = wrist.y * canvas.height - 40;
            ctx.fillStyle = 'rgba(0, 255, 255, 0.9)';
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`🖐️ ${label} Hand`, x, y);
          }
        }

        // Update status
        detectionStatus = `✅ ${handLandmarks.length} tangan terdeteksi`;
        debugInfo.textContent = detectionStatus;
      }

      // --- INISIALISASI MEDIAPIPE ---
      const hands = new Hands({
        locateFile: (file) => {
          return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }
      });

      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 0, // Pakai model ringan
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      hands.onResults((results) => {
        // Reset data
        handLandmarks = [];
        handLabels = [];

        if (results.multiHandLandmarks && results.multiHandedness) {
          for (let i = 0; i < results.multiHandLandmarks.length; i++) {
            handLandmarks.push(results.multiHandLandmarks[i]);
            handLabels.push(results.multiHandedness[i].label);
          }
        }

        // Gambar landmark
        drawLandmarks();

        // Update FPS
        frameCount++;
        const now = performance.now();
        if (now - lastFpsUpdate > 1000) {
          fpsDisplay.textContent = `FPS: ${frameCount}`;
          frameCount = 0;
          lastFpsUpdate = now;
        }
      });

      // --- MULAI KAMERA ---
      debugInfo.textContent = '📷 Memulai kamera...';
      
      const camera = new Camera(video, {
        onFrame: async () => {
          try {
            await hands.send({ image: video });
          } catch (error) {
            console.error('Error processing frame:', error);
          }
        },
        width: 640,
        height: 480,
        facingMode: "user"
      });

      camera.start().then(() => {
        debugInfo.textContent = '📷 Kamera aktif, menunggu tangan...';
        console.log('✅ Kamera berhasil dimulai');
      }).catch((error) => {
        debugInfo.textContent = '❌ Gagal akses kamera: ' + error.message;
        console.error('Camera error:', error);
      });

      console.log('🔍 Mode Debug Tracking Tangan Aktif');
    })();
  </script>
</body>
</html>
