<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pelacakan Tangan & Tali</title>
  <style>
    /* Hapus gaya yang tidak perlu dan pastikan body full screen */
    body {
      margin: 0;
      overflow: hidden;
      background-color: black;
    }
    #video-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      transform: scaleX(-1);
    }
    .info {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: white;
      font-family: sans-serif;
      background: rgba(0,0,0,0.6);
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="video-container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="overlay"></canvas>
    <div class="info">Tunjukkan kedua telunjuk Anda untuk menarik tali</div>
  </div>

  <!-- PASTIKAN: Gunakan versi library yang tepat -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  
  <script>
    (function() {
      const video = document.getElementById('webcam');
      const canvas = document.getElementById('overlay');
      const ctx = canvas.getContext('2d');

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      // Variabel untuk menyimpan landmark tangan
      let rightHandLandmarks = null;
      let leftHandLandmarks = null;

      // --- FUNGSI GAMBAR TALI ---
      function drawString() {
        // Hapus gambar sebelumnya
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (rightHandLandmarks && leftHandLandmarks) {
          // Ambil titik ujung jari telunjuk (index 8)
          const rightIndexTip = rightHandLandmarks[8];
          const leftIndexTip = leftHandLandmarks[8];

          // Hitung koordinat di Canvas
          const xRight = rightIndexTip.x * canvas.width;
          const yRight = rightIndexTip.y * canvas.height;
          const xLeft = leftIndexTip.x * canvas.width;
          const yLeft = leftIndexTip.y * canvas.height;

          // Gambar garis "tali"
          ctx.beginPath();
          ctx.moveTo(xRight, yRight);
          ctx.lineTo(xLeft, yLeft);
          ctx.strokeStyle = '#FF3366';
          ctx.lineWidth = 8;
          ctx.shadowColor = '#FF3366';
          ctx.shadowBlur = 15;
          ctx.stroke();

          // Gambar lingkaran di ujung tali
          ctx.shadowBlur = 20;
          ctx.fillStyle = '#FFD700';
          ctx.beginPath();
          ctx.arc(xRight, yRight, 12, 0, 2 * Math.PI);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(xLeft, yLeft, 12, 0, 2 * Math.PI);
          ctx.fill();
        }
      }

      // --- INISIALISASI MEDIAPIPE ---
      const hands = new Hands({
        locateFile: (file) => {
          return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }
      });

      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      // Callback ketika MediaPipe selesai memproses frame
      hands.onResults((results) => {
        // Reset data tangan
        rightHandLandmarks = null;
        leftHandLandmarks = null;

        if (results.multiHandLandmarks && results.multiHandedness) {
          for (let i = 0; i < results.multiHandLandmarks.length; i++) {
            const landmarks = results.multiHandLandmarks[i];
            // PERHATIKAN: Cara mengakses label tangan yang benar
            const label = results.multiHandedness[i].label;

            if (label === 'Right') {
              rightHandLandmarks = landmarks;
            } else if (label === 'Left') {
              leftHandLandmarks = landmarks;
            }
          }
        }

        // Panggil fungsi untuk menggambar tali
        drawString();
      });

      // --- MULAI KAMERA ---
      const camera = new Camera(video, {
        onFrame: async () => {
          await hands.send({ image: video });
        },
        width: 640,
        height: 480
      });
      camera.start();

      console.log('Aplikasi pelacakan tangan siap!');
    })();
  </script>
</body>
</html>
