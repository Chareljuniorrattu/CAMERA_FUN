<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pelacakan Tangan - Tali Presisi</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: black;
    }
    #video-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      /* JANGAN DI BALIK DI SINI! Kita akan balik secara manual di JS */
    }
    .info {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: white;
      font-family: sans-serif;
      background: rgba(0,0,0,0.6);
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 10;
      pointer-events: none;
    }
    .fps-counter {
      position: absolute;
      top: 20px;
      right: 20px;
      color: #0f0;
      font-family: monospace;
      font-size: 16px;
      z-index: 10;
      pointer-events: none;
      background: rgba(0,0,0,0.5);
      padding: 5px 10px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="video-container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="overlay"></canvas>
    <div class="info">Tunjukkan kedua telunjuk Anda</div>
    <div class="fps-counter" id="fps">FPS: 0</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  
  <script>
    (function() {
      const video = document.getElementById('webcam');
      const canvas = document.getElementById('overlay');
      const ctx = canvas.getContext('2d');
      const fpsDisplay = document.getElementById('fps');

      // --- UKURAN CANVAS SAMA DENGAN VIDEO ---
      let canvasWidth = 640;
      let canvasHeight = 480;
      
      function resizeCanvas() {
        // Canvas menggunakan resolusi tetap untuk konsistensi
        canvasWidth = Math.min(window.innerWidth, 640);
        canvasHeight = Math.min(window.innerHeight, 480);
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;
        canvas.style.width = '100%';
        canvas.style.height = '100%';
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      let rightHandLandmarks = null;
      let leftHandLandmarks = null;
      let frameCount = 0;
      let lastFpsUpdate = performance.now();

      // --- FUNGSI GAMBAR TALI (DENGAN KOORDINAT YANG BENAR) ---
      function drawString() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (rightHandLandmarks && leftHandLandmarks) {
          const rightIndex = rightHandLandmarks[8];
          const leftIndex = leftHandLandmarks[8];

          // 🔥 PERBAIKAN UTAMA: Balik koordinat X agar sesuai dengan video mirror
          // MediaPipe memberi koordinat 0-1 (0=kiri asli, 1=kanan asli)
          // Karena video di-mirror, kita balik: x = 1 - x
          const xRight = (1 - rightIndex.x) * canvas.width;
          const yRight = rightIndex.y * canvas.height;
          const xLeft = (1 - leftIndex.x) * canvas.width;
          const yLeft = leftIndex.y * canvas.height;

          // Gambar tali
          ctx.beginPath();
          ctx.moveTo(xRight, yRight);
          ctx.lineTo(xLeft, yLeft);
          ctx.strokeStyle = '#FF3366';
          ctx.lineWidth = 8;
          ctx.shadowColor = '#FF3366';
          ctx.shadowBlur = 20;
          ctx.stroke();

          // Lingkaran di ujung
          ctx.shadowBlur = 25;
          ctx.fillStyle = '#FFD700';
          ctx.beginPath();
          ctx.arc(xRight, yRight, 14, 0, 2 * Math.PI);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(xLeft, yLeft, 14, 0, 2 * Math.PI);
          ctx.fill();

          // Tambahan: Gambar titik di semua jari untuk debugging
          // Bisa dihapus jika sudah yakin
          ctx.shadowBlur = 0;
          ctx.fillStyle = 'rgba(0, 255, 0, 0.3)';
          if (rightHandLandmarks) {
            for (let i = 0; i < rightHandLandmarks.length; i++) {
              const lm = rightHandLandmarks[i];
              const x = (1 - lm.x) * canvas.width;
              const y = lm.y * canvas.height;
              ctx.beginPath();
              ctx.arc(x, y, 3, 0, 2 * Math.PI);
              ctx.fill();
            }
          }
          if (leftHandLandmarks) {
            for (let i = 0; i < leftHandLandmarks.length; i++) {
              const lm = leftHandLandmarks[i];
              const x = (1 - lm.x) * canvas.width;
              const y = lm.y * canvas.height;
              ctx.beginPath();
              ctx.arc(x, y, 3, 0, 2 * Math.PI);
              ctx.fill();
            }
          }
        }
      }

      // --- INISIALISASI MEDIAPIPE ---
      const hands = new Hands({
        locateFile: (file) => {
          return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }
      });

      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 0,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.6
      });

      hands.onResults((results) => {
        rightHandLandmarks = null;
        leftHandLandmarks = null;

        if (results.multiHandLandmarks && results.multiHandedness) {
          for (let i = 0; i < results.multiHandLandmarks.length; i++) {
            const landmarks = results.multiHandLandmarks[i];
            const label = results.multiHandedness[i].label;

            if (label === 'Right') {
              rightHandLandmarks = landmarks;
            } else if (label === 'Left') {
              leftHandLandmarks = landmarks;
            }
          }
        }

        drawString();

        frameCount++;
        const now = performance.now();
        if (now - lastFpsUpdate > 1000) {
          fpsDisplay.textContent = `FPS: ${frameCount}`;
          frameCount = 0;
          lastFpsUpdate = now;
        }
      });

      // --- KAMERA ---
      const camera = new Camera(video, {
        onFrame: async () => {
          await hands.send({ image: video });
        },
        width: 320,
        height: 240,
        facingMode: "user"
      });
      camera.start();

      console.log('✅ Tali presisi dengan koordinat mirror siap!');
    })();
  </script>
</body>
</html>
