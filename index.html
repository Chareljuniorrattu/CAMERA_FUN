<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEST - Tracking Tangan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            background: #000;
            overflow: hidden;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #info {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0,0,0,0.8);
            padding: 15px 25px;
            border-radius: 10px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            z-index: 100;
            text-align: center;
            border: 2px solid #00ff00;
        }
        #status {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #0f0;
            font-family: monospace;
            font-size: 14px;
            z-index: 100;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="overlay"></canvas>
    </div>
    <div id="status">⏳ Memulai...</div>
    <div id="info">🔴 Titik MERAH di ujung jari telunjuk | Gerakkan jari untuk test</div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <script>
        // --- AMBIL ELEMEN ---
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('overlay');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');

        // --- SETUP CANVAS ---
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- VARIABEL ---
        let tipX = 0;
        let tipY = 0;
        let detected = false;

        // --- FUNGSI GAMBAR ---
        function draw() {
            // Bersihkan canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (detected) {
                // Gambar titik MERAH di ujung jari
                ctx.shadowColor = '#FF0000';
                ctx.shadowBlur = 30;
                ctx.beginPath();
                ctx.arc(tipX, tipY, 20, 0, 2 * Math.PI);
                ctx.fillStyle = '#FF0000';
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Tulisan
                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 20px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('👆 TITIK INI', tipX, tipY - 35);
                
                status.textContent = '✅ Tangan terdeteksi!';
            } else {
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.font = '30px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('✋ Tunjukkan tangan Anda', canvas.width/2, canvas.height/2);
                status.textContent = '⏳ Menunggu tangan...';
            }
        }

        // --- MEDIAPIPE ---
        const hands = new Hands({
            locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }
        });

        hands.setOptions({
            maxNumHands: 1, // Hanya 1 tangan dulu biar simpel
            modelComplexity: 0,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults((results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                // Landmark 8 = ujung jari telunjuk
                const tip = landmarks[8];
                
                // Konversi ke koordinat canvas
                tipX = tip.x * canvas.width;
                tipY = tip.y * canvas.height;
                detected = true;
            } else {
                detected = false;
            }
            
            draw();
        });

        // --- KAMERA ---
        status.textContent = '📷 Memulai kamera...';

        const camera = new Camera(video, {
            onFrame: async () => {
                await hands.send({ image: video });
            },
            width: 640,
            height: 480,
            facingMode: "user"
        });

        camera.start().then(() => {
            status.textContent = '📷 Kamera aktif - Tunjukkan tangan!';
            console.log('✅ Kamera berjalan');
        }).catch((err) => {
            status.textContent = '❌ Error: ' + err.message;
            console.error(err);
        });

        console.log('🔍 Test tracking sederhana');
    </script>
</body>
</html>
