<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pelacakan Tangan - Optimasi</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: black;
    }
    #video-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      transform: scaleX(-1);
    }
    .info {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: white;
      font-family: sans-serif;
      background: rgba(0,0,0,0.6);
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 10;
      pointer-events: none;
    }
    .fps-counter {
      position: absolute;
      top: 20px;
      right: 20px;
      color: #0f0;
      font-family: monospace;
      font-size: 16px;
      z-index: 10;
      pointer-events: none;
      background: rgba(0,0,0,0.5);
      padding: 5px 10px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="video-container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="overlay"></canvas>
    <div class="info">Tunjukkan kedua telunjuk Anda</div>
    <div class="fps-counter" id="fps">FPS: 0</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  
  <script>
    (function() {
      // --- ELEMEN ---
      const video = document.getElementById('webcam');
      const canvas = document.getElementById('overlay');
      const ctx = canvas.getContext('2d');
      const fpsDisplay = document.getElementById('fps');

      // --- UKURAN CANVAS (DIKECILKAN UNTUK PERFORMANCE) ---
      let canvasWidth = 640;
      let canvasHeight = 480;
      
      function resizeCanvas() {
        // Gunakan resolusi lebih kecil untuk performa lebih baik
        canvasWidth = Math.min(window.innerWidth, 640);
        canvasHeight = Math.min(window.innerHeight, 480);
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;
        // Styling tetap full screen
        canvas.style.width = '100%';
        canvas.style.height = '100%';
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      // --- VARIABEL ---
      let rightHandLandmarks = null;
      let leftHandLandmarks = null;
      let frameCount = 0;
      let lastFpsUpdate = performance.now();

      // --- FUNGSI GAMBAR TALI (DIOPTIMALKAN) ---
      function drawString() {
        // Hanya clear area yang diperlukan
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (rightHandLandmarks && leftHandLandmarks) {
          const rightIndex = rightHandLandmarks[8];
          const leftIndex = leftHandLandmarks[8];

          // Koordinat di Canvas (resolusi lebih kecil)
          const xRight = rightIndex.x * canvas.width;
          const yRight = rightIndex.y * canvas.height;
          const xLeft = leftIndex.x * canvas.width;
          const yLeft = leftIndex.y * canvas.height;

          // Gambar tali - HAPUS shadow untuk performa lebih baik
          ctx.beginPath();
          ctx.moveTo(xRight, yRight);
          ctx.lineTo(xLeft, yLeft);
          ctx.strokeStyle = '#FF3366';
          ctx.lineWidth = 6;
          ctx.stroke();

          // Lingkaran di ujung - tanpa shadow
          ctx.fillStyle = '#FFD700';
          ctx.beginPath();
          ctx.arc(xRight, yRight, 10, 0, 2 * Math.PI);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(xLeft, yLeft, 10, 0, 2 * Math.PI);
          ctx.fill();
        }
      }

      // --- INISIALISASI MEDIAPIPE (PAKAI MODEL RINGAN) ---
      const hands = new Hands({
        locateFile: (file) => {
          return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }
      });

      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 0, // 🔥 PAKAI MODEL RINGAN (0 = Lite, 1 = Full)
        minDetectionConfidence: 0.7, // Lebih tinggi = lebih stabil
        minTrackingConfidence: 0.6
      });

      // --- CALLBACK HASIL ---
      hands.onResults((results) => {
        rightHandLandmarks = null;
        leftHandLandmarks = null;

        if (results.multiHandLandmarks && results.multiHandedness) {
          for (let i = 0; i < results.multiHandLandmarks.length; i++) {
            const landmarks = results.multiHandLandmarks[i];
            const label = results.multiHandedness[i].label;

            if (label === 'Right') {
              rightHandLandmarks = landmarks;
            } else if (label === 'Left') {
              leftHandLandmarks = landmarks;
            }
          }
        }

        // Gambar tali setiap frame
        drawString();

        // Update FPS counter
        frameCount++;
        const now = performance.now();
        if (now - lastFpsUpdate > 1000) {
          fpsDisplay.textContent = `FPS: ${frameCount}`;
          frameCount = 0;
          lastFpsUpdate = now;
        }
      });

      // --- KAMERA DENGAN RESOLUSI RENDAH ---
      const camera = new Camera(video, {
        onFrame: async () => {
          await hands.send({ image: video });
        },
        width: 320, // 🔥 Resolusi lebih kecil = lebih cepat
        height: 240,
        facingMode: "user"
      });
      camera.start();

      console.log('Optimasi: Model Lite + Resolusi Rendah');
    })();
  </script>
</body>
</html>
